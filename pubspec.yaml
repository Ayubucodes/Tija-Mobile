name: tija
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  iconsax: ^0.0.8
  flutter_secure_storage: ^10.3.1
  flutter_launcher_icons: ^0.14.4
  cryptography: ^2.7.0
  syncfusion_flutter_pdfviewer: ^34.1.32
  fluttertoast: ^8.2.8
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/gifs/

fonts:
  - family: OpenSans
    fonts:
      - asset: assets/fonts/OpenSans-Regular.ttf
        weight: 400

flutter_launcher_icons:
  image_path: "assets/icons/app_logo.png"
  android: true
  ios: true 
  remove_alpha_ios: true
  min_sdk_android: 23
